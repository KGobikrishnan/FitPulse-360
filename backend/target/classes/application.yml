spring:
  application:
    name: gym-management-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/fitpulse_gym
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Swagger UI & OpenAPI Docs
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# Security JWT
jwt:
  secret: 9a6747f3b97b8d123456789abcdef0123456789abcdef0123456789abcdef012345
  expiration-ms: 86400000 # 24 Hours

server:
  port: 8080
